[project]
name = "rulescope"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "chrys@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-community==0.4.1",
    "langchain-core>=1.6.11",
    "langchain-openai>=1.7.2",
    "langchain-pinecone>=0.2.13",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.15",
    "pandas>=3.0.6",
    "pymupdf4llm>=1.28.2",
    "python-dotenv>=1.2.4",
    "ragas>=0.4.3",
    "rapidfuzz>=3.14.6",
    "streamlit>=1.66.0",
    "tiktoken>=0.14.0",
]

[project.scripts]
rulescope = "rulescope:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
